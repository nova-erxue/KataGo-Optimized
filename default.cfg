# RTX 50 GTP 配置；模型路径通过 -model 指定。
rules = tromp-taylor
maxVisits = 1000
ponderingEnabled = false
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true
cudaUseFP16 = true
cudaUseNHWC = true
# Shape-checked RTX 50 optimizations for compatible KataGo TF/NBT models.
# 48 threads / B16 / 2 servers are starting settings for RTX 5090; tune for your GPU/model.
numSearchThreads = 48
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 16
cudaUseGraphs = true
cudaGraphIncludeTransfers = false
cudaRopeGemmTile = 1
cudaRopeGemmMaxBatch = 4
cudaRopeVectorThreads = 256
cudaUseCublasLt = true
cudaCompactRMSNorm = true
cudaB11Attention = true
cudaB11PackedFFN = true
cudaFusedFFNVariant = register-epilogue
cudaB11Gemm = true
cudaVectorSilu = true
cudaWideRope = true
